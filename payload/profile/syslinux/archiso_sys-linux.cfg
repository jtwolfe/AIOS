LABEL arch
TEXT HELP
Boot the AIOS live installer on BIOS (linux).
ENDTEXT
MENU LABEL AIOS live installer (%ARCH%, BIOS, linux)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL archlts
TEXT HELP
Boot the AIOS live installer on BIOS (linux-lts).
ENDTEXT
MENU LABEL AIOS live installer (%ARCH%, BIOS, linux-lts)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
