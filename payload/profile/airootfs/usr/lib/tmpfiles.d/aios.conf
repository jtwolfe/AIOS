# /usr/lib/tmpfiles.d/aios.conf
d /srv/aios 0755 root root -
# 0751: operator can open known login-request/status; intent.sock stays 0660.
d /run/aios 0751 aios-agent aios-work -
# L-20: root-owned accept stamp lives here; not an aios-agent worktree.
d /etc/aios 0755 root root -
# L-12: create the drop dir if missing. Leave mode/owner so login.py 1731 survives boot.
d /srv/aios/state/brake.d - - - -
